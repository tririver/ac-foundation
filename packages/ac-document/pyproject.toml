[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ac-document"
version = "2.0.3"
description = "Content-addressed document ingestion, parsing, search, and rich-document contracts for AC Foundation."
readme = "README.md"
license = "MIT"
authors = [{ name = "AC Foundation" }]
requires-python = ">=3.11"
dependencies = [
  "ac-jobs>=2,<3",
  "ac-llm>=2,<3",
  "beautifulsoup4>=4.12",
  "jsonschema>=4.22",
  "lxml>=5.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/tririver/ac-foundation"
Repository = "https://github.com/tririver/ac-foundation"
Issues = "https://github.com/tririver/ac-foundation/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ac-document = "ac_document.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ac_document"]
