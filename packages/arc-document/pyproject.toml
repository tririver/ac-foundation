[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arc-document"
version = "1.1.1"
description = "Content-addressed document ingestion, parsing, search, and rich-document contracts for ARC."
readme = "README.md"
license = "MIT"
authors = [{ name = "ARC" }]
requires-python = ">=3.11"
dependencies = [
  "arc-jobs>=1.1,<1.2",
  "arc-llm>=1.1,<1.2",
  "beautifulsoup4>=4.12",
  "jsonschema>=4.22",
  "lxml>=5.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/tririver/arc"
Repository = "https://github.com/tririver/arc"
Issues = "https://github.com/tririver/arc/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
arc-document = "arc_document.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_document"]
