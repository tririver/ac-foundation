name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install build pytest
      - run: >-
          python -m pip install
          -e packages/ac-jobs
          -e packages/ac-llm
          -e packages/ac-document
          -e packages/ac-proposer-reviewer
      - run: python -m pytest --import-mode=importlib packages/*/tests tests
      - run: node tests/test_dsh_llm_bridge.mjs
      - run: scripts/build-packages.sh
